<!doctype html>
<html lang="en">
  <head>
    <title>
      {% if page.title %}
        {{ page.title }} &ndash; {{ site.title }}
      {% else %}
        {{ site.title }}
      {% endif %}
    </title>

    <link rel="stylesheet" href="{{ '/assets/stylesheets/main.css' | relative_url }}">
    <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:image" content="{{ '/assets/images/og-image.png' | relative_url }}" />
    <meta property="og:title" content="Rachel McGrane" />
    <meta name="description" content="I'm Rachel! I'm a designer and CSS developer from Pittsburgh, PA. I have experience in designing interfaces as well as websites and marketing materials." />
    <meta name="og:description" content="I'm Rachel! I'm a designer and CSS developer from Pittsburgh, PA. I have experience in designing interfaces as well as websites and marketing materials." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:description" content="I'm Rachel! I'm a designer and CSS developer from Pittsburgh, PA. I have experience in designing interfaces as well as websites and marketing materials." />
  </head>
  <body>
    <div class="container">
      {% include header.html %}

      <main class="content">
        {{ content }}
      </main>

      {% include footer.html %}
    </div>
  </body>
</html>
